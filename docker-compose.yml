services:
  db:
    image: postgres:16
    container_name: url_shortener_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: url_shortener
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: url_shortener_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pg_data: